<!DOCTYPE html>
<html>

<head>
    <title>Number Data Type</title>

    <style>
        body{
            background-color:bisque;
        }
        .data {
            display: flex;
            row-gap: 11px;
            max-width: 270px;
            flex-direction: column;
            margin: 0px auto;
            padding-top: 10px;
            height: 590px;
            width: 275px;
            padding: 30px;
            background-color: white;
        }

        #btnAddition {
            border-radius: 10px;
        }

        #btnSubtract {
            border-radius: 10px;
        }

        #btnMultiplication {
            border-radius: 10px;
        }

        #btnDivision {
            border-radius: 10px;
        }

        #btnRemainder {
            border-radius: 10px;
        }

        #btnNumber {
            border-radius: 10px;
        }

        #btnMulti {
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="data">

        <h1>Number Data Type</h1>

        <label for="num1">First Number</label>
        <input type="number" id="num1" placeholder="Enter a number">

        <label for="num2">Second Number</label>
        <input type="number" id="num2" placeholder="Enter a number">

        <button id="btnAddition">Addition</button>
        <button id="btnSubtract">Subtract</button>
        <button id="btnMultiplication">Multiplication</button>
        <button id="btnDivision">Division</button>
        <button id="btnRemainder">Remainder</button>

        <label for="square">Square</label>
        <input type="number" id="square" placeholder="Enter a number">
        <button id="btnNumber">Response</button>

        <label for="circle">Number</label>
        <input type="number" id="circle" placeholder="Enter a number">
        <button id="btnMulti">Response</button>

    </div>

</body>

</html>
