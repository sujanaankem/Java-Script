<!DOCTYPE html>
<html>

<head>
    <title>Number Data Type</title>
    <script src="numberDataType.js"></script>
<link rel="stylesheet" href="numberDataType.css">
</head>

<body>

    <div class="data">

        <h1>Number Data Type</h1>

        <label for="num1">First Number</label>
        <input type="number" id="num1" placeholder="Enter a number">

        <label for="num2">Second Number</label>
        <input type="number" id="num2" placeholder="Enter a number">

        <button id="btnAddition" onclick="onClickAddition()">Addition</button>
        <button id="btnSubtract" onclick="onClickSubtract()">Subtract</button>
        <button id="btnMultiplication" onclick="onClickMultiplication()">Multiplication</button>
        <button id="btnDivision" onclick="onClickDivision()">Division</button>
        <button id="btnRemainder" onclick="onClickRemainder()">Remainder</button>

        <label for="square">Square</label>
        <input type="number" id="square" placeholder="Enter a number">
        <button id="btnNumber" onclick="onClickNumber()">Response</button>

        <label for="circle">Number</label>
        <input type="number" id="circle" placeholder="Enter a number">
        <button id="btnMulti" onclick="onClickMulti()">Response</button>
        

    </div>

</body>

</html>
