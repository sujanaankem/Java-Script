<!DOCTYPE html>
<html>

<head>
    <title>Average and Percentage</title>
    <script src="averageAndPercentage.js"></script>
</head>

<body>
    <h1>Subjects average and percentage</h1>
    <table>
        <tr>
            <th>Subjects</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td><label for="lblTelugu">Telugu</label></td>
            <td><input id="telugu" type="number" placeholder="Enter your marks"></td>
        </tr>
        <tr>
            <td><label for="lblHindi">Hindu</label></td>
            <td><input id="hindi" type="number" placeholder="Enter your marks"></td>
        </tr>
        <tr>
            <td><label for="lblEnglish">English</label></td>
            <td><input id="english" type="number" placeholder="Enter your marks"></td>
        </tr>
        <tr>
            <td><label for="lblMaths">Maths</label></td>
            <td><input id="maths" type="number" placeholder="Enter your marks"></td>
        </tr>
        <tr>
            <td><label for="lblScience">Science</label></td>
            <td><input id="science" type="number" placeholder="Enter your marks"></td>
        </tr>
        <tr>
            <td><label for="lblSocial">Social</label></td>
            <td><input id="social" type="number" placeholder="Enter your marks"></td>
        </tr>
    </table>
    <button id="btnPercentage" onclick="onClickPercentage()">Percentage</button>
    <button id="btnAverage" onclick="onClickAverage()">Average</button>
</body>

</html>
