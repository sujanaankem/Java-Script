<!DOCTYPE html>
<html>
    <head>
        <title>Dynamic Square</title>
        <script src="square.js"></script>
    </head>
    <body>
        <h1>Dynamic Square</h1>
        <label for="lblNumber">Value</label>
        <input id="txtNumber" type="number" placeholder="Enter a Number">
        <button id="btnNumber" onclick="onClickSquare()">Check</button>
        <p id="pResult"></p>
<hr>
        <h1>Static Square</h1>
        <button id="btnValue" onclick="onClickStaticSquare()">Check Square Value</button>
        <p id="pValuet"></p>
    </body>
</html>
