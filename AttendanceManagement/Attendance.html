<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Management - Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin: 10px 0 5px 0;
      color: #333;
    }

    h3 {
      margin: 0 0 20px 0;
      color: #555;
      font-weight: normal;
    }

    .container {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 350px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .password-container {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      color: #333;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
  <!-- Font Awesome for eye icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <!-- Title Section -->
  <h1>College Portal</h1>
  <h3>Attendance and Performance Tracking System</h3>

  <!-- Registration Form -->
  <div class="container">
    <h2>Register</h2>
    <form id="registerForm">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="phone">Phone No</label>
      <input type="tel" id="phone" name="phone" oninput="if(this.value.length > 10) this.value = this.value.slice(0, 10);"  required>

      <label for="password">Password</label>
      <div class="password-container">
        <input type="password" id="password" name="password" required>
        <i class="fa-solid fa-eye toggle-password" onclick="togglePassword()"></i>
      </div>

      <label for="type">Type</label>
      <select id="type" name="type" required>
        <option value="">--Select--</option>
        <option value="student">Student</option>
        <option value="lecturer">Lecturer</option>
      </select>

      <button type="submit">Submit</button>
    </form>
  </div>

  <script>
    // Toggle password visibility
    function togglePassword() {
      const passwordField = document.getElementById("password");
      const toggleIcon = document.querySelector(".toggle-password");
      if (passwordField.type === "password") {
        passwordField.type = "text";
        toggleIcon.classList.remove("fa-eye");
        toggleIcon.classList.add("fa-eye-slash");
      } else {
        passwordField.type = "password";
        toggleIcon.classList.remove("fa-eye-slash");
        toggleIcon.classList.add("fa-eye");
      }
    }

    // Save registration data to localStorage
    document.getElementById("registerForm").addEventListener("submit", function (event) {
      event.preventDefault(); // prevent page reload

      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const password = document.getElementById("password").value;
      const type = document.getElementById("type").value;

      const user = { name, phone, password, type };

      let users = JSON.parse(localStorage.getItem("users")) || [];
      users.push(user);
      localStorage.setItem("users", JSON.stringify(users));
      alert("Registration successful!");
      document.getElementById("registerForm").reset();
      window.location.href = "Login.html";

    });
  </script>
</body>

</html>
